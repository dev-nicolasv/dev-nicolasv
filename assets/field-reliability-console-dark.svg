<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">NV Field Reliability Console - dark theme</title>
  <desc id="desc">Dark industrial firmware profile banner. An animated signal pulse travels from sensor to microcontroller, real-time operating system, communications link, and field deployment. Motion stops when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.58" stop-color="#07111F"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.075"/>
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#2563EB"/>
    </marker>
    <style>
      .signal-pulse {
        animation: signal-travel 7.2s linear infinite;
        stroke-dasharray: 78 457;
      }
      .heartbeat {
        animation: heartbeat-trace 3.2s ease-out infinite;
        stroke-dasharray: 82;
      }
      .live-dot {
        animation: status-beat 3.2s ease-in-out infinite;
      }
      @keyframes signal-travel {
        to { stroke-dashoffset: -535; }
      }
      @keyframes heartbeat-trace {
        0%, 20% { opacity: 0.28; stroke-dashoffset: 82; }
        48%, 100% { opacity: 1; stroke-dashoffset: 0; }
      }
      @keyframes status-beat {
        0%, 38%, 62%, 100% { opacity: 0.45; }
        48%, 54% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .signal-pulse,
        .heartbeat,
        .live-dot {
          animation: none;
        }
        .signal-pulse { opacity: 0.5; }
        .heartbeat,
        .live-dot { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1600" height="460" rx="26" fill="url(#background)"/>
  <rect width="1600" height="460" rx="26" fill="url(#grid)"/>
  <path d="M0 454H1600" stroke="url(#signal)" stroke-width="12"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(70 48)">
      <rect width="516" height="34" rx="17" fill="#22D3EE" opacity="0.08"/>
      <text x="18" y="23" fill="#22D3EE" font-size="17" font-weight="700" letter-spacing="2.5">NV / FIELD RELIABILITY CONSOLE</text>
      <circle class="live-dot" cx="492" cy="17" r="5" fill="#22D3EE" filter="url(#soft-glow)"/>
    </g>

    <text x="70" y="154" fill="#F6F8FB" font-size="48" font-weight="700">Firmware built for the part</text>
    <text x="70" y="212" fill="#F6F8FB" font-size="48" font-weight="700">after the demo.</text>
    <text x="72" y="259" fill="#F6F8FB" fill-opacity="0.68" font-size="21">Embedded systems engineered to stay reliable in the field.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">
      <rect x="70" y="294" width="168" height="42" rx="10" fill="#22D3EE" opacity="0.09"/>
      <rect x="70" y="294" width="168" height="42" rx="10" fill="none" stroke="#22D3EE" stroke-opacity="0.38"/>
      <text x="89" y="321" fill="#F6F8FB">ESP32 / STM32</text>

      <rect x="250" y="294" width="120" height="42" rx="10" fill="#2563EB" opacity="0.12"/>
      <rect x="250" y="294" width="120" height="42" rx="10" fill="none" stroke="#2563EB" stroke-opacity="0.55"/>
      <text x="271" y="321" fill="#F6F8FB">FreeRTOS</text>

      <rect x="382" y="294" width="194" height="42" rx="10" fill="#F59E0B" opacity="0.09"/>
      <rect x="382" y="294" width="194" height="42" rx="10" fill="none" stroke="#F59E0B" stroke-opacity="0.48"/>
      <text x="402" y="321" fill="#F6F8FB">LoRaWAN / RS485</text>
    </g>

    <text x="72" y="398" fill="#F6F8FB" fill-opacity="0.54" font-size="16" font-weight="700" letter-spacing="1.7">BUILD  /  VALIDATE  /  DEPLOY  /  KEEP RUNNING</text>
  </g>

  <g transform="translate(795 48)">
    <rect width="735" height="348" rx="22" fill="#07111F" fill-opacity="0.82" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M24 76H711" stroke="#22D3EE" stroke-opacity="0.18"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="28" y="43" fill="#F6F8FB" fill-opacity="0.62" font-size="16" font-weight="700" letter-spacing="2">SIGNAL PATH / LIVE</text>
      <path class="heartbeat" d="M540 38h10l6-11 8 22 8-11h18" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="live-dot" cx="684" cy="38" r="6" fill="#22D3EE" filter="url(#soft-glow)"/>
      <text x="663" y="44" fill="#22D3EE" font-size="15" font-weight="700" text-anchor="end">NOMINAL</text>

      <path d="M133 155H158" stroke="#22D3EE" stroke-width="3" marker-end="url(#arrow-cyan)"/>
      <path d="M257 155H282" stroke="#22D3EE" stroke-width="3" marker-end="url(#arrow-cyan)"/>
      <path d="M381 155H406" stroke="#22D3EE" stroke-width="3" marker-end="url(#arrow-cyan)"/>
      <path d="M505 155H530" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/>

      <g fill="#22D3EE" fill-opacity="0.075" stroke="#22D3EE" stroke-opacity="0.5">
        <rect x="28" y="106" width="105" height="98" rx="12"/>
        <rect x="152" y="106" width="105" height="98" rx="12"/>
        <rect x="276" y="106" width="105" height="98" rx="12"/>
      </g>
      <rect x="400" y="106" width="105" height="98" rx="12" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-opacity="0.72"/>
      <rect x="524" y="106" width="183" height="98" rx="12" fill="#2563EB" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.72"/>

      <g fill="#F6F8FB" font-size="17" font-weight="700" text-anchor="middle">
        <text x="80.5" y="139">SENSOR</text>
        <text x="204.5" y="139">MCU</text>
        <text x="328.5" y="139">RTOS</text>
        <text x="452.5" y="139">LINK</text>
        <text x="615.5" y="139">FIELD</text>
      </g>
      <g fill="#F6F8FB" fill-opacity="0.58" font-size="15" text-anchor="middle">
        <text x="80.5" y="177">4-20 mA</text>
        <text x="204.5" y="177">ESP32</text>
        <text x="328.5" y="177">CONTROL</text>
        <text x="452.5" y="177">LORA / RS485</text>
        <text x="615.5" y="177">DEPLOYED</text>
      </g>

      <path d="M80 220H615" fill="none" stroke="#22D3EE" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round"/>
      <path class="signal-pulse" d="M80 220H615" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" filter="url(#soft-glow)"/>
      <g fill="#22D3EE">
        <circle cx="80" cy="220" r="3"/>
        <circle cx="204" cy="220" r="3"/>
        <circle cx="328" cy="220" r="3"/>
        <circle cx="452" cy="220" r="3"/>
        <circle cx="615" cy="220" r="3"/>
      </g>

      <rect x="28" y="237" width="679" height="76" rx="14" fill="#F59E0B" opacity="0.075"/>
      <rect x="28" y="237" width="679" height="76" rx="14" fill="none" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="52" y="267" fill="#F59E0B" font-size="16" font-weight="700" letter-spacing="1.5">RELIABILITY LAYER</text>
      <text x="52" y="294" fill="#F6F8FB" fill-opacity="0.72" font-size="16">VALIDATED BOOT  /  WATCHDOG  /  OTA ROLLBACK  /  TELEMETRY</text>
      <path d="M650 258l12 12-12 12-12-12z" fill="none" stroke="#F59E0B" stroke-width="2"/>
    </g>
  </g>
</svg>
