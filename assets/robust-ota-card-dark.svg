<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic control and recoverable OTA reference architecture - dark theme</title>
  <desc id="desc">A separated real-time control plane runs beside an update path that downloads firmware, validates SHA-256, selects an A or B partition, and exposes a rollback path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.66" stop-color="#0A1627"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.055"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L7 3.5L0 7Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L7 3.5L0 7Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="780" height="420" rx="24" fill="url(#background)"/>
  <rect width="780" height="420" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="778" height="418" rx="23" fill="none" stroke="#F59E0B" stroke-opacity="0.26" stroke-width="2"/>
  <path d="M0 414H780" stroke="#F59E0B" stroke-width="12"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(40 31)">
      <rect width="268" height="31" rx="15.5" fill="#F59E0B" opacity="0.075"/>
      <rect width="268" height="31" rx="15.5" fill="none" stroke="#F59E0B" stroke-opacity="0.38"/>
      <text x="17" y="21" fill="#F59E0B" font-size="14" font-weight="700" letter-spacing="1.7">REFERENCE ARCHITECTURE</text>
    </g>
    <text x="719" y="52" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="end">ROLLBACK PATH</text>

    <text x="40" y="111" fill="#F6F8FB" font-size="33" font-weight="750">DETERMINISTIC CONTROL + ROBUST OTA</text>
    <text x="42" y="144" fill="#F6F8FB" fill-opacity="0.64" font-size="18">Keep the control loop running while update work stays isolated</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="40" y="177" width="178" height="139" rx="15" fill="#22D3EE" fill-opacity="0.055" stroke="#22D3EE" stroke-opacity="0.48" stroke-width="2"/>
      <text x="61" y="205" fill="#22D3EE" font-size="14" font-weight="700" letter-spacing="1.4">CONTROL PLANE</text>
      <path d="M61 244h17l8-15 11 31 11-16h18" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="61" y="282" fill="#F6F8FB" font-size="17" font-weight="700">REAL-TIME LOOP</text>
      <text x="61" y="302" fill="#F6F8FB" fill-opacity="0.54" font-size="12">PRIORITY / WATCHDOG</text>

      <path d="M238 185V307M250 185V307" stroke="#F59E0B" stroke-opacity="0.52" stroke-width="2" stroke-dasharray="7 7"/>
      <text x="244" y="170" fill="#F59E0B" font-size="14" font-weight="700" text-anchor="middle">||</text>

      <path d="M370 234H384" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M494 234H508" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M618 234H632" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-amber)"/>

      <g fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-opacity="0.52" stroke-width="2">
        <rect x="260" y="190" width="110" height="88" rx="13"/>
        <rect x="384" y="190" width="110" height="88" rx="13"/>
        <rect x="508" y="190" width="110" height="88" rx="13"/>
      </g>
      <rect x="632" y="190" width="108" height="88" rx="13" fill="#F59E0B" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.62" stroke-width="2"/>

      <g fill="#F6F8FB" font-size="15.5" font-weight="700" text-anchor="middle">
        <text x="315" y="226">UPDATE</text>
        <text x="439" y="226">SHA-256</text>
        <text x="563" y="226">A / B</text>
        <text x="686" y="226">ROLLBACK</text>
      </g>
      <g fill="#F6F8FB" fill-opacity="0.54" font-size="11" text-anchor="middle">
        <text x="315" y="251">HTTPS</text>
        <text x="439" y="251">VALIDATE</text>
        <text x="563" y="251">PARTITION</text>
        <text x="686" y="251">RECOVER</text>
      </g>
      <text x="500" y="307" fill="#F6F8FB" fill-opacity="0.52" font-size="12.5" text-anchor="middle" letter-spacing="1">VALIDATE BEFORE BOOT</text>

      <rect x="40" y="340" width="700" height="43" rx="11" fill="#F59E0B" fill-opacity="0.065" stroke="#F59E0B" stroke-opacity="0.34"/>
      <text x="61" y="367" fill="#F6F8FB" fill-opacity="0.68" font-size="13" font-weight="700" letter-spacing="0.8">CONTROL KEEPS RUNNING  /  VERIFY  /  SWITCH  /  RECOVER</text>
    </g>
  </g>
</svg>
