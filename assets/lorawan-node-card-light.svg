<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
  <title id="title">Industrial LoRaWAN node project - light theme</title>
  <desc id="desc">A four stage signal chain from a 4 to 20 milliamp industrial input through an ADS1115 converter and ESP32 to a LoRa-E5 radio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F8FB"/>
      <stop offset="0.68" stop-color="#F6F8FB"/>
      <stop offset="1" stop-color="#087E8B" stop-opacity="0.09"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#087E8B" stroke-width="1" opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L7 3.5L0 7Z" fill="#087E8B"/>
    </marker>
  </defs>

  <rect width="780" height="420" rx="24" fill="url(#background)"/>
  <rect width="780" height="420" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="778" height="418" rx="23" fill="none" stroke="#087E8B" stroke-opacity="0.26" stroke-width="2"/>
  <path d="M0 414H780" stroke="#087E8B" stroke-width="12"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(40 31)">
      <rect width="300" height="31" rx="15.5" fill="#087E8B" opacity="0.06"/>
      <rect width="300" height="31" rx="15.5" fill="none" stroke="#087E8B" stroke-opacity="0.36"/>
      <text x="17" y="21" fill="#087E8B" font-size="14" font-weight="700" letter-spacing="1.7">OPEN SOURCE / RELEASE V1.0.0</text>
    </g>
    <circle cx="719" cy="47" r="6" fill="#087E8B" filter="url(#glow)"/>
    <text x="701" y="53" fill="#087E8B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="end">CI PASS</text>

    <text x="40" y="112" fill="#172033" font-size="35" font-weight="750">INDUSTRIAL LORAWAN NODE</text>
    <text x="42" y="145" fill="#172033" fill-opacity="0.68" font-size="18">Field signal acquisition to long-range telemetry</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <path d="M182 234H212" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M354 234H384" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M526 234H556" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/>

      <g fill="#087E8B" fill-opacity="0.04" stroke="#087E8B" stroke-opacity="0.48" stroke-width="2">
        <rect x="40" y="177" width="142" height="120" rx="14"/>
        <rect x="212" y="177" width="142" height="120" rx="14"/>
        <rect x="384" y="177" width="142" height="120" rx="14"/>
      </g>
      <rect x="556" y="177" width="142" height="120" rx="14" fill="#2563EB" fill-opacity="0.06" stroke="#087E8B" stroke-opacity="0.58" stroke-width="2"/>

      <path d="M72 216h13l7-12 9 24 9-12h12" fill="none" stroke="#087E8B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#087E8B" opacity="0.82">
        <rect x="251" y="204" width="7" height="24" rx="2"/>
        <rect x="263" y="198" width="7" height="30" rx="2"/>
        <rect x="275" y="209" width="7" height="19" rx="2"/>
        <rect x="287" y="193" width="7" height="35" rx="2"/>
        <rect x="299" y="202" width="7" height="26" rx="2"/>
      </g>
      <g fill="none" stroke="#087E8B" stroke-width="2">
        <rect x="425" y="198" width="58" height="34" rx="5"/>
        <path d="M417 204h8m-8 8h8m-8 8h8m58-16h8m-8 8h8m-8 8h8"/>
        <path d="M602 224a25 25 0 0 1 50 0M610 224a17 17 0 0 1 34 0M619 224a8 8 0 0 1 16 0"/>
      </g>

      <g fill="#172033" font-size="18" font-weight="700" text-anchor="middle">
        <text x="111" y="257">4-20 mA</text>
        <text x="283" y="257">ADS1115</text>
        <text x="455" y="257">ESP32</text>
        <text x="627" y="257">LoRa-E5</text>
      </g>
      <g fill="#172033" fill-opacity="0.6" font-size="12.5" text-anchor="middle">
        <text x="111" y="280">FIELD INPUT</text>
        <text x="283" y="280">PRECISION ADC</text>
        <text x="455" y="280">CONTROL</text>
        <text x="627" y="280">RADIO LINK</text>
      </g>

      <rect x="40" y="334" width="658" height="48" rx="12" fill="#2563EB" fill-opacity="0.045" stroke="#2563EB" stroke-opacity="0.34"/>
      <text x="61" y="364" fill="#172033" fill-opacity="0.7" font-size="13.5" font-weight="700" letter-spacing="1">LOW-POWER  /  PLATFORMIO CI  /  MIT LICENSE</text>
      <text x="677" y="364" fill="#087E8B" font-size="13.5" font-weight="700" text-anchor="end">FIELD NODE</text>
    </g>
  </g>
</svg>
